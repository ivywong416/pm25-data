name: Collect PM2.5

on:
  schedule:
    - cron: "5 * * * *"   # 每小时第 5 分钟(UTC,对整点无影响)
  workflow_dispatch:       # 允许手动点击运行

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python collect_pm25.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sg_pm25_history.csv
          git diff --staged --quiet || git commit -m "update PM2.5 data"
          git push
